<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Triple Comparison Test</title>
    <link rel="stylesheet" href="./static/css/index.css">
    <script src="./static/js/script.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .test-container {
            width: 800px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Triple Comparison Test</h1>

        <div id="test-triple" class="triple-container-small">
            <div class="triple-left">
                <img src="./static/images/comparsion/gs_cake.png">
                <div class="triple-leftPosition leftLabel">
                    3D-GS
                </div>
            </div>

            <div class="triple-middle" style="left: 33.33%; width: 33.33%;">
                <img src="./static/images/comparsion/cake.png">
                <div class="triple-middlePosition middleLabel">
                    Baseline
                </div>
            </div>

            <div class="triple-right">
                <img src="./static/images/comparsion/cake.png">
                <div class="triple-rightPosition rightLabel" style="z-index:1;">
                    Ours
                </div>
            </div>

            <div class="triple-handle-left" style="left: 33.33%;">
                <span class="handle-left-arrow"></span>
                <span class="handle-right-arrow"></span>
            </div>

            <div class="triple-handle-right" style="left: 66.66%;">
                <span class="handle-left-arrow"></span>
                <span class="handle-right-arrow"></span>
            </div>
        </div>
    </div>

    <script>
        new TripleComparison({
            id: '#test-triple'
        });
    </script>
</body>
</html>
